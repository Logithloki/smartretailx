services:

  localstack:
    image: localstack/localstack:3.0
    container_name: smartretailx-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,dynamodb,s3,events,secretsmanager
      - DEBUG=0
      - PERSISTENCE=1
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"
      - "localstack_data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: smartretailx-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: smartretailx_admin
      POSTGRES_PASSWORD: SmartRetailX2026!Secure
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartretailx_admin -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Build context is ./services for every service so the shared srx_common
  # package can be copied into each image.
  user-service:
    build:
      context: ./services
      dockerfile: user-service/Dockerfile
    container_name: smartretailx-user-service
    ports:
      - "8003:8000"
    env_file:
      - ./services/user-service/.env.local
    depends_on:
      localstack:
        condition: service_healthy


name: reusable-browser-e2e

on:
  workflow_call:
    inputs:
      environment_name: { required: true, type: string }

permissions:
  contents: read

jobs:
  e2e:
    environment: ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    # The Playwright container image ships browsers + system deps
    # preinstalled, removing the 4-6 min `install-deps` apt-get step.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      E2E_BASE_URL: ${{ vars.SMARTRETAILX_PUBLIC_URL }}
      E2E_CUSTOMER_USERNAME: ${{ secrets.CUSTOMER_USERNAME }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      E2E_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ inputs.environment_name }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

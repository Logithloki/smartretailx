name: reusable-browser-e2e

on:
  workflow_call:
    inputs:
      environment_name: { required: true, type: string }

permissions:
  contents: read

jobs:
  e2e:
    environment: ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.SMARTRETAILX_PUBLIC_URL }}
      E2E_CUSTOMER_USERNAME: ${{ secrets.CUSTOMER_USERNAME }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      E2E_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        working-directory: frontend
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Install system deps only (cache hit)
        working-directory: frontend
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ inputs.environment_name }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

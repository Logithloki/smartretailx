name: Seed non-production catalogue

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - development
          - test
          - staging

permissions:
  id-token: write
  contents: read

jobs:
  seed:
    uses: ./.github/workflows/reusable-seed-nonprod.yml
    with:
      environment_name: ${{ inputs.environment }}
    secrets: inherit

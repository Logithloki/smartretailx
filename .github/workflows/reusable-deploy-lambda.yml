name: reusable-deploy-lambda

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      function_name:
        required: true
        type: string
      alias_name:
        required: true
        type: string
      release_run_id:
        required: true
        type: string
      role_arn:
        required: true
        type: string
      environment_name:
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.deploy.outputs.version }}
      rollback_version:
        value: ${{ jobs.deploy.outputs.rollback_version }}

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: smartretailx-${{ inputs.environment_name }}-lambda-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.publish.outputs.version }}
      rollback_version: ${{ steps.previous.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-release-artifacts
          path: release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: eu-west-1
      - id: previous
        shell: bash
        run: |
          version=$(aws lambda get-alias --function-name '${{ inputs.function_name }}' \
            --name '${{ inputs.alias_name }}' --query FunctionVersion --output text 2>/dev/null || true)
          echo "version=${version:-none}" >> "$GITHUB_OUTPUT"
      - id: publish
        name: Publish artifact and move environment alias
        shell: bash
        run: |
          archive="release/lambdas/${{ inputs.component }}.zip"
          expected=$(awk -v file="${{ inputs.component }}.zip" '$2 ~ file {print $1}' release/lambda-checksums.sha256)
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$expected"
          aws lambda update-function-code --function-name '${{ inputs.function_name }}' \
            --zip-file "fileb://$archive" >/dev/null
          aws lambda wait function-updated --function-name '${{ inputs.function_name }}'
          version=$(aws lambda publish-version --function-name '${{ inputs.function_name }}' \
            --description "release run ${{ inputs.release_run_id }}" --query Version --output text)
          if aws lambda get-alias --function-name '${{ inputs.function_name }}' \
            --name '${{ inputs.alias_name }}' >/dev/null 2>&1; then
            aws lambda update-alias --function-name '${{ inputs.function_name }}' \
              --name '${{ inputs.alias_name }}' --function-version "$version" >/dev/null
          else
            aws lambda create-alias --function-name '${{ inputs.function_name }}' \
              --name '${{ inputs.alias_name }}' --function-version "$version" >/dev/null
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"


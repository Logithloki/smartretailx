name: reusable-python-quality

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      coverage_threshold:
        required: false
        type: number
        default: 60

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Supports Lambda services whose deployment module lives at service root
      # (for example order-outbox-publisher/handler.py).
      PYTHONPATH: ${{ github.workspace }}/services/${{ inputs.service }}:${{ github.workspace }}/services/common
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and quality dependencies
        working-directory: services/${{ inputs.service }}
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov httpx 'moto[all]' ruff==0.12.7 bandit==1.8.6 pip-audit==2.9.0
      - name: Static correctness checks
        working-directory: services/${{ inputs.service }}
        run: |
          ruff check . --select E9,F63,F7,F82
          bandit -q -r . -x ./tests
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; fi
      - name: Tests and measured coverage gate
        working-directory: services/${{ inputs.service }}
        run: >-
          pytest -q --cov=. --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=${{ inputs.coverage_threshold }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.service }}
          path: services/${{ inputs.service }}/coverage.xml

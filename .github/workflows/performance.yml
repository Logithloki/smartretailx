name: Performance evidence

# k6 load-test workflow.  Mirrors the runtime Cognito authentication design
# already used by reusable-smoke-tests and reusable-api-tests: no persistent
# JWT is stored as a GitHub secret, and no live token is written to the
# repository or artifact.  A short-lived AccessToken is minted per job from
# the durable SMOKE_USERNAME / SMOKE_PASSWORD environment secret via
# AdminInitiateAuth and injected into k6 as $AUTH_TOKEN.

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [test, staging]
        required: true
      profile:
        type: choice
        options: [smoke, load, concurrent, stress, spike]
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: smartretailx-performance-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  k6:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT_NAME: ${{ inputs.environment }}
      BASE_URL: ${{ vars.SMARTRETAILX_PUBLIC_URL }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      COGNITO_AUTHORITY: ${{ vars.SMARTRETAILX_COGNITO_AUTHORITY }}
      COGNITO_CLIENT_ID: ${{ vars.SMARTRETAILX_COGNITO_CLIENT_ID }}
    steps:
      - name: Refuse to load-test production
        shell: bash
        run: |
          set -euo pipefail
          case "$ENVIRONMENT_NAME" in
            test|staging) echo "load-testing $ENVIRONMENT_NAME" ;;
            *) echo "REFUSED: performance workflow must never bind to '$ENVIRONMENT_NAME'"; exit 1 ;;
          esac
      - name: Validate performance Environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for setting in BASE_URL SMOKE_USERNAME SMOKE_PASSWORD COGNITO_AUTHORITY COGNITO_CLIENT_ID; do
            [[ -n "${!setting:-}" ]] || { echo "Missing required Environment setting: $setting"; exit 1; }
          done
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SMARTRETAILX_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Obtain fresh Cognito smoke access token
        shell: bash
        run: ./scripts/obtain-cognito-token.sh SMOKE
      - uses: grafana/setup-k6-action@v1
      - name: Run intentionally selected profile
        env:
          K6_PROFILE: ${{ inputs.profile }}
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.profile }}' in
            smoke) script=k6-tests/order-smoke.js ;;
            load) script=k6-tests/load-test.js ;;
            concurrent) script=k6-tests/concurrent-users.js ;;
            stress) script=k6-tests/stress-test.js ;;
            spike) script=k6-tests/spike-test.js ;;
          esac
          # SMOKE_TOKEN comes from obtain-cognito-token.sh via GITHUB_ENV.
          # Re-export it under the AUTH_TOKEN name the k6 scripts expect.
          export AUTH_TOKEN="$SMOKE_TOKEN"
          k6 run --summary-export k6-summary.json "$script"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-${{ inputs.environment }}-${{ inputs.profile }}
          path: k6-summary.json

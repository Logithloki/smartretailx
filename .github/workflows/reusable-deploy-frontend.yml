name: reusable-deploy-frontend

on:
  workflow_call:
    inputs:
      release_run_id: { required: true, type: string }
      release_id: { required: true, type: string }
      environment_name: { required: true, type: string }

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: smartretailx-${{ inputs.environment_name }}-frontend
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_ROLE_ARN: ${{ vars.SMARTRETAILX_DEPLOY_ROLE_ARN }}
      SPA_BUCKET: ${{ vars.SMARTRETAILX_SPA_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.SMARTRETAILX_DISTRIBUTION_ID }}
      PUBLIC_URL: ${{ vars.SMARTRETAILX_PUBLIC_URL }}
      WEBSOCKET_URL: ${{ vars.SMARTRETAILX_WEBSOCKET_URL }}
      COGNITO_AUTHORITY: ${{ vars.SMARTRETAILX_COGNITO_AUTHORITY }}
      COGNITO_DOMAIN: ${{ vars.SMARTRETAILX_COGNITO_DOMAIN }}
      COGNITO_CLIENT_ID: ${{ vars.SMARTRETAILX_COGNITO_CLIENT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-release-artifacts
          path: release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Validate environment deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for setting in DEPLOY_ROLE_ARN SPA_BUCKET DISTRIBUTION_ID PUBLIC_URL WEBSOCKET_URL COGNITO_AUTHORITY COGNITO_DOMAIN COGNITO_CLIENT_ID; do
            [[ -n "${!setting:-}" ]] || { echo "Missing required Environment variable: $setting"; exit 1; }
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SMARTRETAILX_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Materialize validated runtime configuration beside immutable SPA
        shell: bash
        run: |
          mkdir dist
          tar -C dist -xzf release/smartretailx-spa.tgz
          jq -n \
            --arg apiBaseUrl "${PUBLIC_URL%/}" \
            --arg websocketUrl "$WEBSOCKET_URL" \
            --arg cognitoAuthority "$COGNITO_AUTHORITY" \
            --arg cognitoDomain "$COGNITO_DOMAIN" \
            --arg cognitoClientId "$COGNITO_CLIENT_ID" \
            --arg redirectUri "${PUBLIC_URL%/}/callback" \
            --arg logoutUri "${PUBLIC_URL%/}/" \
            --arg environment '${{ inputs.environment_name }}' \
            --arg releaseId '${{ inputs.release_id }}' \
            '{apiBaseUrl:$apiBaseUrl,websocketUrl:$websocketUrl,cognitoAuthority:$cognitoAuthority,cognitoDomain:$cognitoDomain,cognitoClientId:$cognitoClientId,redirectUri:$redirectUri,logoutUri:$logoutUri,environment:$environment,releaseId:$releaseId}' \
            > dist/config.json
          jq -e '[.apiBaseUrl,.websocketUrl,.cognitoAuthority,.cognitoDomain,.cognitoClientId,.redirectUri,.logoutUri,.environment,.releaseId] | all(.[]; type == "string" and length > 0)' dist/config.json
      - name: Store versioned release and update live pointers
        shell: bash
        run: |
          prefix="releases/${{ inputs.release_id }}"
          aws s3 sync dist "s3://$SPA_BUCKET/$prefix/" --delete
          aws s3 sync dist/assets "s3://$SPA_BUCKET/assets/" \
            --cache-control 'public,max-age=31536000,immutable' --delete
          aws s3 cp dist/index.html "s3://$SPA_BUCKET/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate'
          aws s3 cp dist/config.json "s3://$SPA_BUCKET/config.json" \
            --cache-control 'no-cache,no-store,must-revalidate'
          printf '{"releaseId":"%s","sourceRun":"%s"}\n' '${{ inputs.release_id }}' '${{ inputs.release_run_id }}' > current-release.json
          aws s3 cp current-release.json "s3://$SPA_BUCKET/release.json" \
            --cache-control 'no-cache,no-store,must-revalidate'
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/index.html' '/config.json' '/release.json' >/dev/null

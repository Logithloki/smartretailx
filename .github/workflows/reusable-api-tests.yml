name: reusable-newman-api-tests

on:
  workflow_call:
    inputs:
      environment_name: { required: true, type: string }

permissions:
  contents: read

jobs:
  newman:
    environment: ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.SMARTRETAILX_PUBLIC_URL }}
      CUSTOMER_TOKEN: ${{ secrets.CUSTOMER_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute authenticated API, RBAC and Saga collection
        run: |
          mkdir -p evidence/newman
          npx --yes newman@6.2.1 run postman/SmartRetailX.postman_collection.json \
            -e postman/SmartRetailX.postman_environment.json \
            --env-var apiBaseUrl="$API_BASE_URL" \
            --env-var customerToken="$CUSTOMER_TOKEN" \
            --env-var adminToken="$ADMIN_TOKEN" \
            --reporters cli,junit,json \
            --reporter-junit-export evidence/newman/results.xml \
            --reporter-json-export evidence/newman/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-${{ inputs.environment_name }}
          path: evidence/newman/
          retention-days: 14

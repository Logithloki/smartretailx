name: Production reviewed-plan deployment

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Staging-passed immutable release run ID
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: smartretailx-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      order_digest: ${{ steps.release.outputs.order_digest }}
      inventory_digest: ${{ steps.release.outputs.inventory_digest }}
      product_digest: ${{ steps.release.outputs.product_digest }}
      user_digest: ${{ steps.release.outputs.user_digest }}
      order_image: ${{ steps.release.outputs.order_image }}
      inventory_image: ${{ steps.release.outputs.inventory_image }}
      product_image: ${{ steps.release.outputs.product_image }}
      user_image: ${{ steps.release.outputs.user_image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - id: release
        shell: bash
        run: |
          jq -e '([.order_service_digest,.inventory_service_digest,.product_service_digest,.user_service_digest]
            | all(test("^sha256:[0-9a-f]{64}$"))) and
            ([.order_service_image,.inventory_service_image,.product_service_image,.user_service_image]
            | all(test("^[0-9]+\\.dkr\\.ecr\\.eu-west-1\\.amazonaws\\.com/smartretailx/(order|inventory|product|user)-service@sha256:[0-9a-f]{64}$")))' release/release-manifest.json >/dev/null
          echo "release_id=$(jq -r .release_id release/release-manifest.json)" >> "$GITHUB_OUTPUT"
          for service in order inventory product user; do
            echo "${service}_digest=$(jq -r ".${service}_service_digest" release/release-manifest.json)" >> "$GITHUB_OUTPUT"
            echo "${service}_image=$(jq -r ".${service}_service_image" release/release-manifest.json)" >> "$GITHUB_OUTPUT"
          done

  plan:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SMARTRETAILX_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Create immutable release variables without rebuilding
        working-directory: infra
        env:
          ORDER: ${{ needs.release.outputs.order_image }}
          INVENTORY: ${{ needs.release.outputs.inventory_image }}
          PRODUCT: ${{ needs.release.outputs.product_image }}
          USER: ${{ needs.release.outputs.user_image }}
        run: |
          jq -n --arg order "$ORDER" --arg inventory "$INVENTORY" \
            --arg product "$PRODUCT" --arg user "$USER" \
            '{service_image_references:{order:$order,inventory:$inventory,product:$product,user:$user}}' \
            > release.auto.tfvars.json
      - name: Produce and guard the production plan
        working-directory: infra
        shell: bash
        run: |
          terraform init -reconfigure -backend-config=environments/production/backend.hcl
          terraform plan -var-file=environments/production/terraform.tfvars.json \
            -var-file=release.auto.tfvars.json -var=live=true -out=tfplan -detailed-exitcode || code=$?
          test "${code:-0}" -ne 1
          terraform show -json tfplan > tfplan.json
          jq '{add:([.resource_changes[]? | select(.change.actions == ["create"])]|length),change:([.resource_changes[]? | select(.change.actions == ["update"])]|length),destroy:([.resource_changes[]? | select(.change.actions | index("delete"))]|length)}' tfplan.json > plan-summary.json
          protected='aws_cognito_user_pool|aws_rds_cluster|aws_dynamodb_table\.(orders|products)|aws_s3_bucket\.spa|aws_cloudfront_distribution|aws_ecr_repository|aws_apigatewayv2_api|aws_vpc|aws_iam_openid_connect_provider'
          unexpected=$(jq -r --arg pattern "$protected" \
            '.resource_changes[]? | select(.change.actions | index("delete")) | .address | select(test($pattern))' tfplan.json)
          test -z "$unexpected" || { echo "Protected resource destruction detected:"; echo "$unexpected"; exit 1; }
          cat plan-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-production-plan
          path: |
            infra/tfplan
            infra/tfplan.json
            infra/plan-summary.json
          retention-days: 2

  apply_reviewed_plan:
    needs: [plan, snapshot_rollback_targets]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SMARTRETAILX_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-production-plan
          path: infra
      - name: Apply the exact approved binary plan
        working-directory: infra
        run: |
          terraform init -reconfigure -backend-config=environments/production/backend.hcl
          terraform apply tfplan

  snapshot_rollback_targets:
    needs: [release, plan]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SMARTRETAILX_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Capture every currently active release pointer
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg release '${{ needs.release.outputs.release_id }}' \
            '{targetRelease:$release,ecs:{},lambdas:{},frontend:null}' > rollback.json
          for service in order inventory product user; do
            task=$(aws ecs describe-services --cluster '${{ vars.SMARTRETAILX_ECS_CLUSTER_NAME }}' \
              --services '${{ vars.SMARTRETAILX_PROJECT_NAME }}-'"$service"'-service' \
              --query 'services[0].taskDefinition' --output text)
            jq --arg service "$service" --arg task "$task" '.ecs[$service]=$task' rollback.json > next.json
            mv next.json rollback.json
          done
          for suffix in notification stock-reconciliation ws-authorizer ws-connect ws-disconnect ws-push order-outbox-publisher; do
            version=$(aws lambda get-alias --function-name '${{ vars.SMARTRETAILX_PROJECT_NAME }}-'"$suffix" \
              --name production --query FunctionVersion --output text)
            jq --arg suffix "$suffix" --arg version "$version" '.lambdas[$suffix]=$version' rollback.json > next.json
            mv next.json rollback.json
          done
          previous=$(aws s3 cp 's3://${{ vars.SMARTRETAILX_SPA_BUCKET }}/release.json' - 2>/dev/null | jq -r '.releaseId // empty' || true)
          jq --arg previous "$previous" '.frontend=($previous | select(length>0))' rollback.json > next.json
          mv next.json rollback.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-rollback-targets
          path: rollback.json
          retention-days: 14

  ecs:
    needs: [release, snapshot_rollback_targets, apply_reviewed_plan]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { service: order, image_output: order_image, migrate: false }
          - { service: inventory, image_output: inventory_image, migrate: true }
          - { service: product, image_output: product_image, migrate: false }
          - { service: user, image_output: user_image, migrate: false }
    uses: ./.github/workflows/reusable-deploy-ecs.yml
    with:
      service: ${{ matrix.service }}
      image_reference: ${{ needs.release.outputs[matrix.image_output] }}
      environment_name: production
      run_migration: ${{ matrix.migrate }}

  lambdas:
    needs: [release, ecs]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { component: notification-lambda, suffix: notification }
          - { component: reconciliation-lambda, suffix: stock-reconciliation }
          - { component: ws-authorizer-lambda, suffix: ws-authorizer }
          - { component: ws-connect-lambda, suffix: ws-connect }
          - { component: ws-disconnect-lambda, suffix: ws-disconnect }
          - { component: ws-push-lambda, suffix: ws-push }
          - { component: order-outbox-publisher, suffix: order-outbox-publisher }
    uses: ./.github/workflows/reusable-deploy-lambda.yml
    with:
      component: ${{ matrix.component }}
      function_suffix: ${{ matrix.suffix }}
      release_run_id: ${{ inputs.release_run_id }}
      environment_name: production

  frontend:
    needs: [release, ecs, lambdas]
    uses: ./.github/workflows/reusable-deploy-frontend.yml
    with:
      release_run_id: ${{ inputs.release_run_id }}
      release_id: ${{ needs.release.outputs.release_id }}
      environment_name: production

  verify:
    needs: frontend
    uses: ./.github/workflows/reusable-smoke-tests.yml
    with:
      environment_name: production
    secrets: inherit

  automatic-rollback:
    if: >-
      always() && needs.snapshot_rollback_targets.result == 'success' &&
      (needs.ecs.result == 'failure' || needs.lambdas.result == 'failure' ||
       needs.frontend.result == 'failure' || needs.verify.result == 'failure' ||
       needs.browser_e2e.result == 'failure')
    needs: [snapshot_rollback_targets, ecs, lambdas, frontend, verify, browser_e2e]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-rollback-targets
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SMARTRETAILX_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Restore ECS revisions, Lambda aliases and SPA release
        shell: bash
        run: |
          set -euo pipefail
          for service in order inventory product user; do
            task=$(jq -r --arg service "$service" '.ecs[$service]' rollback.json)
            aws ecs update-service --cluster '${{ vars.SMARTRETAILX_ECS_CLUSTER_NAME }}' \
              --service '${{ vars.SMARTRETAILX_PROJECT_NAME }}-'"$service"'-service' \
              --task-definition "$task" >/dev/null
          done
          aws ecs wait services-stable --cluster '${{ vars.SMARTRETAILX_ECS_CLUSTER_NAME }}' \
            --services $(for service in order inventory product user; do printf '%s ' '${{ vars.SMARTRETAILX_PROJECT_NAME }}-'"$service"'-service'; done)
          for suffix in notification stock-reconciliation ws-authorizer ws-connect ws-disconnect ws-push order-outbox-publisher; do
            version=$(jq -r --arg suffix "$suffix" '.lambdas[$suffix]' rollback.json)
            aws lambda update-alias --function-name '${{ vars.SMARTRETAILX_PROJECT_NAME }}-'"$suffix" \
              --name production --function-version "$version" >/dev/null
          done
          previous=$(jq -r '.frontend // empty' rollback.json)
          if [[ -n "$previous" ]]; then
            aws s3 sync 's3://${{ vars.SMARTRETAILX_SPA_BUCKET }}/releases/'"$previous"'/' \
              's3://${{ vars.SMARTRETAILX_SPA_BUCKET }}/'
            printf '{"releaseId":"%s","rollback":true}\n' "$previous" > release.json
            aws s3 cp release.json 's3://${{ vars.SMARTRETAILX_SPA_BUCKET }}/release.json' \
              --cache-control 'no-cache,no-store,must-revalidate'
            aws cloudfront create-invalidation --distribution-id '${{ vars.SMARTRETAILX_DISTRIBUTION_ID }}' \
              --paths '/index.html' '/config.json' '/release.json' >/dev/null
          fi
          jq '. + {rolledBackAt: now | todateiso8601}' rollback.json > rollback-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-rollback-result
          path: rollback-result.json

  browser_e2e:
    needs: verify
    uses: ./.github/workflows/reusable-browser-e2e.yml
    with:
      environment_name: production
    secrets: inherit

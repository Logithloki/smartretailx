name: Promote immutable release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful main-branch Build immutable release run ID
        required: true
        type: string
      environment:
        description: "Promote in order: development, test, then staging"
        required: true
        type: choice
        options: [development, test, staging]

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: smartretailx-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.manifest.outputs.release_id }}
      order_image: ${{ steps.manifest.outputs.order_image }}
      inventory_image: ${{ steps.manifest.outputs.inventory_image }}
      product_image: ${{ steps.manifest.outputs.product_image }}
      user_image: ${{ steps.manifest.outputs.user_image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - id: manifest
        name: Validate release authority
        shell: bash
        run: |
          jq -e '
            (.release_id | length > 0) and
            (.git_sha | test("^[0-9a-f]{40}$")) and
            ([.order_service_digest,.inventory_service_digest,.product_service_digest,.user_service_digest]
              | all(test("^sha256:[0-9a-f]{64}$")))
          ' release/release-manifest.json >/dev/null
          echo "release_id=$(jq -r .release_id release/release-manifest.json)" >> "$GITHUB_OUTPUT"
          for service in order inventory product user; do
            image=$(jq -r ".${service}_service_image" release/release-manifest.json)
            [[ "$image" =~ ^[0-9]+\.dkr\.ecr\.eu-west-1\.amazonaws\.com/smartretailx/${service}-service@sha256:[0-9a-f]{64}$ ]] || { echo "Invalid immutable $service image reference"; exit 1; }
            echo "${service}_image=$image" >> "$GITHUB_OUTPUT"
          done

  ecs:
    needs: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: order
            image_output: order_image
            migrate: false
          - service: inventory
            image_output: inventory_image
            migrate: true
          - service: product
            image_output: product_image
            migrate: false
          - service: user
            image_output: user_image
            migrate: false
    uses: ./.github/workflows/reusable-deploy-ecs.yml
    with:
      service: ${{ matrix.service }}
      image_reference: ${{ needs.release.outputs[matrix.image_output] }}
      environment_name: ${{ inputs.environment }}
      run_migration: ${{ matrix.migrate }}

  lambdas:
    needs: [release, ecs]
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: notification-lambda
            suffix: notification
          - component: reconciliation-lambda
            suffix: stock-reconciliation
          - component: ws-authorizer-lambda
            suffix: ws-authorizer
          - component: ws-connect-lambda
            suffix: ws-connect
          - component: ws-disconnect-lambda
            suffix: ws-disconnect
          - component: ws-push-lambda
            suffix: ws-push
          - component: order-outbox-publisher
            suffix: order-outbox-publisher
    uses: ./.github/workflows/reusable-deploy-lambda.yml
    with:
      component: ${{ matrix.component }}
      function_suffix: ${{ matrix.suffix }}
      release_run_id: ${{ inputs.release_run_id }}
      environment_name: ${{ inputs.environment }}

  frontend:
    needs: [release, ecs, lambdas]
    uses: ./.github/workflows/reusable-deploy-frontend.yml
    with:
      release_run_id: ${{ inputs.release_run_id }}
      release_id: ${{ needs.release.outputs.release_id }}
      environment_name: ${{ inputs.environment }}

  smoke:
    needs: frontend
    uses: ./.github/workflows/reusable-smoke-tests.yml
    with:
      environment_name: ${{ inputs.environment }}
    secrets:
      SMOKE_ACCESS_TOKEN: ${{ secrets.SMOKE_ACCESS_TOKEN }}

  browser-e2e:
    if: inputs.environment != 'development'
    needs: smoke
    uses: ./.github/workflows/reusable-browser-e2e.yml
    with:
      environment_name: ${{ inputs.environment }}

  api-contracts:
    if: inputs.environment != 'development'
    needs: smoke
    uses: ./.github/workflows/reusable-api-tests.yml
    with:
      environment_name: ${{ inputs.environment }}
